// Top-level build file
buildscript {
    ext.kotlin_version = '1.9.22'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'app.cash.paparazzi:paparazzi-gradle-plugin:1.3.4'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    // Build output (hundreds of MB) goes OUTSIDE the project folder, so the project stays a few MB and is easy to
    // copy to another PC. On Windows: %LOCALAPPDATA%\FaizaBuild\…  The APK to install is copied to Desktop\Faiza.
    def outRoot = System.getenv('LOCALAPPDATA') ?: System.getProperty('java.io.tmpdir')
    buildDir = new File(outRoot, "FaizaBuild/${rootProject.name}/${project.name}")
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
